name: Release

# FR-41: a release only runs for a vX.Y.Z tag whose commit is reachable from
# main -- the job fails before building anything otherwise, so a tag on a
# stray branch can never produce a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GO_VERSION: '1.26.10'

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    # FR-42/FR-43: only this job holds id-token (keyless signing) and
    # contents:write (creating the release); packages:write is scoped here
    # too, for the one push to ghcr.io (NFR-14).
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: needed for the changelog and the ancestry check below
          persist-credentials: false

      - name: Verify the tag is on main
        run: |
          git fetch origin main --depth=1000
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME at $GITHUB_SHA is not reachable from main; refusing to release"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> 2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: '1'

      # NFR-18: the release was created as a draft (.goreleaser.yml); it only
      # becomes visible if every archive contains nothing beyond the product
      # allowlist. A failure here leaves the draft in place.
      - name: Check release contents (NFR-18)
        run: .github/scripts/check-release-contents.sh dist

      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
