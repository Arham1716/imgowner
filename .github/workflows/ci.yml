name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# GOTOOLCHAIN defaults to "auto", which silently downloads a newer Go
# toolchain when go.mod's "go" directive requires one. That let a dependency
# bump requiring Go 1.26 pass "go build" here while the project is deliberately
# pinned to Go 1.23 for toolchain compatibility (see go.mod) -- the mismatch
# only surfaced because the Lint job's golangci-lint binary couldn't do the
# same silent upgrade. Pinning GOTOOLCHAIN=local makes an incompatible bump
# fail the build directly, instead of only being caught as a side effect.
env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build ./...

  e2e:
    name: End-to-end attribution
    runs-on: ubuntu-latest
    # Scans real images from Docker Hub; skipped on forks, which have no
    # access to the pull credentials and would hit anonymous rate limits.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.76.0
          trivy --version

      - name: Run e2e tests
        run: go test -tags e2e -timeout 20m ./internal/e2e/...

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install
        run: npm ci

      # Dev-only dependencies, but the extension ships from a security tool's
      # repo; a HIGH advisory in its own toolchain should not go unnoticed.
      - name: Audit
        run: npm audit --audit-level=high

      # @types/vscode is pinned to the engines.vscode floor, so this fails if
      # the code uses any API newer than the oldest VS Code it claims to support.
      - name: Compile
        run: npx tsc -p ./

      - name: Package
        run: npx vsce package --no-dependencies

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true

      # .golangci.yml uses the v2 config schema; golangci-lint-action@v6 only
      # knows how to install and run v1.x binaries, which fail to parse it
      # (confirmed: the step failed in ~13s on every open PR, too fast to
      # have actually linted anything). v9 supports v2 binaries directly.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          args: --timeout=5m
