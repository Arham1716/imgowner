name: CI

# Every change lands on staging first; staging is promoted to main by a PR
# the owner merges (FR-39, FR-40). Both branches run the full suite.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Least privilege by default (NFR-14); no job here needs to write anything.
permissions:
  contents: read

# GOTOOLCHAIN defaults to "auto", which silently downloads a newer Go
# toolchain when go.mod's "go" directive requires one, so a dependency bump
# could quietly change the compiler every release is built with. Pinning
# GOTOOLCHAIN=local makes that fail the build instead, and GO_VERSION below is
# the one toolchain everything is built, tested and released with.
env:
  GOTOOLCHAIN: local
  GO_VERSION: '1.26.10'
  NODE_VERSION: '24'

jobs:
  # A PR into main must come from staging and nowhere else (FR-39/FR-40).
  # It passes trivially for PRs into staging so it can be a required check on
  # both branches.
  promotion-guard:
    name: Promotion guard
    runs-on: ubuntu-latest
    steps:
      - name: Only staging may be promoted to main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "staging" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::PRs into main must come from $THIS_REPO:staging (got $HEAD_REPO:$HEAD_REF). Target staging instead."
            exit 1
          fi
      - run: echo "ok"

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          (cd tools && go mod tidy && git diff --exit-code go.mod go.sum)

      - name: Vet
        run: go vet ./...

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build ./...

  e2e:
    name: End-to-end attribution
    runs-on: ubuntu-latest
    # Scans real images from Docker Hub; skipped on forks, which have no
    # access to the pull credentials and would hit anonymous rate limits.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Trivy
        run: |
          .github/scripts/fetch-verified.sh \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz \
            e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7 \
            trivy /usr/local/bin
          trivy --version

      - name: Run e2e tests
        run: go test -tags e2e -timeout 20m ./internal/e2e/...

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      # --ignore-scripts: no dependency gets to run code at install time (NFR-15).
      - name: Install
        run: npm ci --ignore-scripts

      # Dev-only dependencies, but the extension ships from a security tool's
      # repo; a HIGH advisory in its own toolchain should not go unnoticed.
      # Fails on any HIGH/CRITICAL advisory unless it's a reviewed, written
      # exception in .github/audit-exceptions.json (NFR-44) -- a bare
      # `npm audit` would otherwise block every PR the next time any
      # transitive dev dependency gets a new advisory with no fix out yet.
      - name: Audit
        working-directory: ${{ github.workspace }} # escape the job's editors/vscode default; the script takes a repo-relative path
        run: node .github/scripts/check-npm-audit.mjs editors/vscode

      # @types/vscode is pinned to the engines.vscode floor, so this fails if
      # the code uses any API newer than the oldest VS Code it claims to support.
      - name: Compile
        run: npx tsc -p ./

      - name: Package
        run: npx vsce package --no-dependencies

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  # FR-44 / FR-45: any finding here blocks the merge. Every tool is pinned:
  # Go tools through the separate tools/ module (so none of them enter the
  # product's go.mod or SBOM), gitleaks by release checksum.
  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history, not just this diff

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build gate tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd tools
          go build -o "$RUNNER_TEMP/bin/" \
            github.com/securego/gosec/v2/cmd/gosec \
            golang.org/x/vuln/cmd/govulncheck \
            github.com/google/go-licenses/v2
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        run: |
          .github/scripts/fetch-verified.sh \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            gitleaks "$RUNNER_TEMP/bin"

      - name: Secrets (gitleaks, full history)
        run: gitleaks git . --redact --no-banner --exit-code 1

      - name: SAST (gosec, HIGH)
        run: gosec -quiet -severity high -confidence medium -exclude-dir=tools ./...

      - name: Vulnerable dependencies (govulncheck)
        run: govulncheck ./...

      - name: Go licences
        run: go-licenses check ./... --disallowed_types=forbidden,restricted,unknown

      - name: npm licences
        run: node .github/scripts/check-npm-licenses.mjs editors/vscode/package-lock.json web/dashboard/package-lock.json

  # NFR-16: the same source must always build to the same bytes, wherever it is
  # built from. Builds the release binary twice from two different directory
  # paths with the release flags and requires identical hashes (-trimpath is
  # what keeps the path out of the binary); the release workflow separately
  # rebuilds the real tag against the published binary.
  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build twice from different paths and compare
        run: |
          mkdir -p /tmp/one /tmp/deeper/path/two
          git archive HEAD | tar -x -C /tmp/one
          git archive HEAD | tar -x -C /tmp/deeper/path/two
          for d in /tmp/one /tmp/deeper/path/two; do
            (cd "$d" && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false               -ldflags "-s -w -X main.version=0.0.0-ci -X main.commit=0000 -X main.date=2000-01-01T00:00:00Z"               -o imgowner ./cmd/imgowner)
          done
          sha256sum /tmp/one/imgowner /tmp/deeper/path/two/imgowner
          [ "$(sha256sum < /tmp/one/imgowner)" = "$(sha256sum < /tmp/deeper/path/two/imgowner)" ]             || { echo "::error::the same source built to different binaries from different paths"; exit 1; }

  # FR-33, NFR-11, NFR-15, NFR-19: the dashboard's compiled bundle is committed
  # (so `go install` users get it without Node); this rebuilds it from source
  # and fails on any difference, so no hand-edited or stale JavaScript can sit
  # in internal/dashboard/dist unnoticed.
  dashboard:
    name: Dashboard bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Dependency budget and exact pins
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/check-dashboard-deps.mjs web/dashboard/package.json

      # --ignore-scripts: no dependency runs code at install time (NFR-15).
      - name: Install
        run: npm ci --ignore-scripts

      - name: Audit
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/check-npm-audit.mjs web/dashboard

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Committed bundle matches a fresh build
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --porcelain -- internal/dashboard/dist)" ]; then
            git status --porcelain -- internal/dashboard/dist
            echo "::error::internal/dashboard/dist differs from what web/dashboard builds. Run 'npm ci && npm run build' in web/dashboard (on Linux, or in a node container) and commit the result."
            exit 1
          fi

  # FR-47..FR-50: builds and pushes 4 real fixture images to a throwaway,
  # job-local registry, then runs the real built binary and real Trivy
  # against each, cross-checking digests and layer DiffIDs against values
  # computed independently by the registry and the container runtime.
  realimage:
    name: Real-image suite
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Trivy
        run: |
          .github/scripts/fetch-verified.sh \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz \
            e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7 \
            trivy /usr/local/bin

      - name: Run real-image suite
        env:
          REALIMAGE_REGISTRY: localhost:5000
        run: go test -tags realimage -timeout 25m ./test/realimage/...

  # The published GitHub Action (action.yml), run the way users run it. It
  # installs the latest signed release (the action's own code is what this
  # PR changes), scans a real image, and must keep hostile inputs as data.
  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build a fixture image
        run: |
          mkdir -p "$RUNNER_TEMP/fx"
          printf 'FROM alpine:3.20\nRUN apk add --no-cache curl\n' > "$RUNNER_TEMP/fx/Dockerfile"
          printf 'version: 1\npolicy:\n  fail_on: []\n' > "$RUNNER_TEMP/fx/imgowner.yaml"
          docker build -q -t localhost:5000/fx:ci "$RUNNER_TEMP/fx"
          docker push -q localhost:5000/fx:ci

      - id: scan
        uses: ./
        with:
          version: 0.6.0
          image: localhost:5000/fx:ci
          dockerfile: ${{ runner.temp }}/fx/Dockerfile
          config: ${{ runner.temp }}/fx/imgowner.yaml
          output-dir: action-report
          upload-sarif: 'false'

      - name: The action produced a real report
        env:
          COUNT: ${{ steps.scan.outputs.findings-count }}
        run: |
          test -s action-report/imgowner-report.json
          test -s action-report/imgowner-report.sarif
          test -n "$COUNT"
          test "$COUNT" = "$(jq '.findings | length' action-report/imgowner-report.json)"

      # The common case: a repository with no .imgowner.yaml at all, using
      # the config input's own default. This is the README's own example and
      # went unverified: the action always passed --config .imgowner.yaml
      # explicitly, which imgowner correctly treats as "the user asked for
      # this file", requiring it to exist -- breaking every user who never
      # created one.
      - id: noconfig
        uses: ./
        with:
          version: 0.6.0
          image: localhost:5000/fx:ci
          dockerfile: ${{ runner.temp }}/fx/Dockerfile
          output-dir: noconfig-report
          artifact-name: noconfig-report # "scan" above already succeeds and
          # uploads the default artifact-name; this one would too, and two
          # uploads under the same name in one job conflict (409).
          upload-sarif: 'false'

      - name: The action works with no config file in the repository
        run: test -s noconfig-report/imgowner-report.json

      # The payloads only create marker files; the inputs must reach imgowner
      # as plain strings and never run.
      - id: hostile
        continue-on-error: true
        uses: ./
        with:
          version: 0.6.0
          image: 'alpine:3.20"; touch /tmp/injected-image; echo "'
          dockerfile: 'Dockerfile"; touch /tmp/injected-dockerfile; echo "'
          pr-id: '1; touch /tmp/injected-pr'
          format: 'md,$(touch /tmp/injected-format)'
          output-dir: hostile-report
          upload-sarif: 'false'

      - name: Hostile inputs did not execute
        run: |
          for f in /tmp/injected-image /tmp/injected-dockerfile /tmp/injected-pr /tmp/injected-format; do
            if [ -e "$f" ]; then echo "::error::input injection: $f was created"; exit 1; fi
          done

      # Unpinned use must fail loudly rather than install something unverified.
      - id: unpinned
        continue-on-error: true
        uses: ./
        with:
          image: localhost:5000/fx:ci
          dockerfile: ${{ runner.temp }}/fx/Dockerfile
          upload-sarif: 'false'

      - name: Unpinned use was refused
        run: test "${{ steps.unpinned.outcome }}" = failure

  # FR-46: every parser of untrusted input is fuzzed on every PR. A crash
  # fails the job and the crashing input is kept as an artifact.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/dockerfile, target: FuzzParseBytes }
          - { pkg: ./internal/pins, target: FuzzExtract }
          - { pkg: ./internal/pins, target: FuzzParseLookupOutput }
          - { pkg: ./internal/pins, target: FuzzApplyEdits }
          - { pkg: ./internal/attribution, target: FuzzAttribute }
          - { pkg: ./internal/history, target: FuzzDecodeRecord }
          - { pkg: ./internal/history, target: FuzzDecodeSummary }
          - { pkg: ./internal/dashboard, target: FuzzParseScanQuery }
          - { pkg: ./internal/dashboard, target: FuzzRepository }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Fuzz for 30s
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: go test "$PKG" -run='^$' -fuzz="^${TARGET}\$" -fuzztime=30s

      - name: Keep crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: '**/testdata/fuzz/${{ matrix.target }}/**'
          if-no-files-found: ignore
