version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Security gate tools (gosec, govulncheck, go-licenses). Separate module so
  # they never enter the product's dependency graph or SBOM.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly

  # Actions are pinned by commit SHA (NFR-14); Dependabot bumps the SHA and
  # its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    ignore:
      # Pinned to the engines.vscode floor on purpose: newer type definitions
      # would let code compile against APIs older VS Code versions don't have.
      # Bump together with engines.vscode, never on its own.
      - dependency-name: "@types/vscode"
